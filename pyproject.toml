[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisos"
version = "1.0.0"
description = "AegisOS Autonomous Remediation, Security Sandboxing & Benchmark Platform"
authors = [{name = "AegisOS Team"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "docker>=7.0.0",
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegisos*", "demo*"]

[tool.pytest.ini_options]
addopts = "-W ignore"
pythonpath = ["."]
